spring:
  application:
    name: mcp-client
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
    mcp:
      client:
        # Connect on first use instead of at startup, so the app also starts
        # (and the login page works) while the MCP server is still booting.
        initialized: false
        streamable-http:
          connections:
            student-server:
              url: ${MCP_SERVER_URL:http://localhost:8080}
              endpoint: /mcp

# Behind Traefik: trust X-Forwarded-* so rate limiting sees the real client IP.
server:
  forward-headers-strategy: framework
  port: ${PORT:8081}

# One shared login. CHAT_PASSWORD_HASH must be a bcrypt hash, never plaintext.
chat:
  username: ${CHAT_USERNAME:}
  password-hash: ${CHAT_PASSWORD_HASH:}

logging:
  level:
    kmo.dev: DEBUG
    org.springframework.ai.mcp: INFO
