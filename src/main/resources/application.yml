spring:
  application:
    name: mcp-client
  main:
    web-application-type: none
    # Banner and startup logs would drown out the console chat.
    banner-mode: off
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.6-flash
    mcp:
      client:
        streamable-http:
          connections:
            student-server:
              url: http://localhost:8080
              # Must match the server's endpoint (default: /mcp).
              endpoint: /mcp
logging:
  level:
    kmo.dev: DEBUG
    org.springframework.ai.mcp: DEBUG
