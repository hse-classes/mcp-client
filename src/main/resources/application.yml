spring:
  application:
    name: mcp-client

  main:
    web-application-type: none

  shell:
    interactive:
      enabled: true

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        options:
          model: gemini-2.5-flash
          temperature: 0.7

    mcp:
      client:
        sse:
          connections:
            student-server:
              url:  http://localhost:8080 # OHNE /mcp/sse!

logging:
  level:
    kmo.dev: DEBUG
    org.springframework.ai.mcp: DEBUG