<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCP Chat - Login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="login">
    <h1>MCP Chat</h1>
    <p class="error" th:if="${param.error}">Benutzername oder Passwort falsch.</p>
    <p class="hint" th:if="${param.logout}">Abgemeldet.</p>
    <form method="post" th:action="@{/login}">
        <input type="text" name="username" placeholder="Benutzername" required autofocus autocomplete="username">
        <input type="password" name="password" placeholder="Passwort" required autocomplete="current-password">
        <button class="primary" type="submit">Anmelden</button>
    </form>
</div>
</body>
</html>
